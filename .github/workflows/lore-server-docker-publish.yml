# ── Manual Lore Server Docker image publishing workflow ──
# Check out a selected revision from Epic Games' official Lore repository,
# then build with the upstream Dockerfile and publish the image to GHCR.

name: Lore Server Docker Publish

on:
  workflow_dispatch:
    inputs:
      lore_ref:
        description: "Branch, tag, or commit SHA from EpicGames/lore"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Image tag to publish to GHCR, such as latest or v0.1.0"
        required: true
        default: "latest"
        type: string
      platforms:
        description: "Target platform; Lore arm64 builds require SVE-capable AWS Graviton3"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/arm64"
          - "linux/amd64,linux/arm64"

env:
  # GitHub Container Registry requires a lowercase image owner and repository name.
  IMAGE_NAME: ghcr.io/arnochenfx/lore-server

concurrency:
  # Serialize publications of the same tag so an older run cannot overwrite a newer manifest.
  group: lore-server-docker-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish Lore Server image
    runs-on: ubuntu-latest

    permissions:
      # Read the public upstream source and write packages to the current account's GHCR.
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. Validate the tag before passing it to Docker metadata and GHCR.
      - name: Validate publishing inputs
        shell: bash
        env:
          # Pass user input through the environment instead of interpolating it into shell code.
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$INPUT_IMAGE_TAG" =~ ^[a-z0-9_][a-z0-9._-]{0,127}$ ]]; then
            echo "The image tag may contain only lowercase letters, digits, dots, underscores, and hyphens."
            exit 1
          fi

      # 2. Check out the selected Lore branch, tag, or commit into an isolated directory.
      - name: Check out Epic Games Lore source
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: ${{ inputs.lore_ref }}
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      # 3. Resolve the exact commit and publish an immutable sha-* tag for traceability.
      - name: Resolve Lore source revision
        id: source
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Building Lore commit: $full_sha"

      # 4. Prepare QEMU and Docker Buildx for cross-platform builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry with the workflow's short-lived token.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Generate the requested tag, source revision tag, and semantic-version aliases.
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      # 7. Build selected platforms with Lore's official Dockerfile and push the image and cache.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server
          cache-to: type=gha,mode=max,scope=lore-server
