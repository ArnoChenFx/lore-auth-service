# ── Lore Server Docker image publishing workflow ──
# Scheduled tasks:
#   - Daily at 03:17 UTC, build the upstream EpicGames/lore main branch as nightly + latest + sha-xxx (skip if sha tag already exists in GHCR)
#   - Daily at 03:17 UTC, check upstream for a new stable Release (e.g., v0.8.6, excluding draft/prerelease); if GHCR does not yet have the version tag, build and push stable + v0.8.6 + semver aliases + sha-xxx
# Manual trigger:
#   - Keep the original workflow_dispatch: any lore_ref and image_tag can be specified and built with the original logic

name: Lore Server Docker Publish

on:
  # Check upstream daily at 03:17 UTC.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lore_ref:
        description: "Branch, tag, or commit SHA from EpicGames/lore"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Image tag to publish to GHCR, such as latest or v0.1.0"
        required: true
        default: "latest"
        type: string
      platforms:
        description: "Target platform; Lore arm64 builds require SVE-capable AWS Graviton3"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/arm64"
          - "linux/amd64,linux/arm64"

env:
  # GitHub Container Registry requires a lowercase image owner and repository name.
  IMAGE_NAME: ghcr.io/arnochenfx/lore-server

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Manual build: fully compatible with the original logic, always builds
  # ═══════════════════════════════════════════════════════════════
  build-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Manual build
    runs-on: ubuntu-latest
    concurrency:
      # Serialize by input tag to prevent older runs from overwriting newer manifests.
      group: lore-server-docker-${{ inputs.image_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate publishing inputs
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$INPUT_IMAGE_TAG" =~ ^[a-z0-9_][a-z0-9._-]{0,127}$ ]]; then
            echo "The image tag may contain only lowercase letters, digits, dots, underscores, and hyphens."
            exit 1
          fi

      - name: Check out Epic Games Lore source
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: ${{ inputs.lore_ref }}
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Building Lore commit: $full_sha (ref: ${{ inputs.lore_ref }})"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server
          cache-to: type=gha,mode=max,scope=lore-server

  # ═══════════════════════════════════════════════════════════════
  # Daily nightly: tracks the latest commit on upstream main
  # Tags: nightly + latest + sha-<short> (latest tracks nightly)
  # Deduplication: skip if sha-xxx already exists in GHCR
  # ═══════════════════════════════════════════════════════════════
  build-nightly:
    if: ${{ github.event_name == 'schedule' }}
    name: Nightly build (main → nightly)
    runs-on: ubuntu-latest
    concurrency:
      group: lore-server-docker-nightly
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out Epic Games Lore source (main)
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: main
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream main HEAD: $full_sha"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether nightly revision is already published
        id: publication
        shell: bash
        env:
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE_NAME}:sha-${SOURCE_SHORT_SHA}"
          if docker manifest inspect "$immutable_image" > /dev/null 2>&1; then
            echo "Upstream commit already published as $immutable_image; skipping nightly build."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream commit not yet published as $immutable_image; starting nightly build."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata (nightly)
        id: meta
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Daily builds are always tagged as nightly and latest, plus an immutable sha tag for traceability.
          tags: |
            type=raw,value=nightly
            type=raw,value=latest
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push nightly image
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server-nightly
          cache-to: type=gha,mode=max,scope=lore-server-nightly

  # ═══════════════════════════════════════════════════════════════
  # Auto stable: detects the latest upstream stable Release
  # Tags: stable + v0.8.6 + semver aliases (0.8.6/0.8/0) + sha-xxx
  # Deduplication: skip if GHCR already has the v0.8.6 tag
  # Logic: call /releases/latest (excludes draft/prerelease),
  #        fallback to scanning /releases list for the latest non-prerelease if needed
  # ═══════════════════════════════════════════════════════════════
  build-stable:
    if: ${{ github.event_name == 'schedule' }}
    name: Stable build (release → stable + version)
    runs-on: ubuntu-latest
    concurrency:
      group: lore-server-docker-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve latest stable release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Querying upstream for the latest stable Release..."
          api_latest="https://api.github.com/repos/EpicGames/lore/releases/latest"
          api_list="https://api.github.com/repos/EpicGames/lore/releases?per_page=20"

          # Prefer /releases/latest (GitHub automatically excludes draft/prerelease).
          response=$(curl -sk -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api_latest" || true)
          tag=$(echo "$response" | jq -r '.tag_name // empty' 2>/dev/null || true)
          prerelease=$(echo "$response" | jq -r '.prerelease // empty' 2>/dev/null || true)
          draft=$(echo "$response" | jq -r '.draft // empty' 2>/dev/null || true)
          message=$(echo "$response" | jq -r '.message // empty' 2>/dev/null || true)

          # Fallback to list query if /latest returns no valid tag (e.g., API rate limit or no stable release).
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "/releases/latest returned no valid tag (message: $message); scanning /releases list..."
            list_response=$(curl -sk -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api_list" || true)
            tag=$(echo "$list_response" | jq -r '[.[] | select(.draft==false and .prerelease==false)] | sort_by(.published_at) | last | .tag_name // empty' 2>/dev/null || true)
            if [[ -n "$tag" && "$tag" != "null" ]]; then
              echo "Found latest stable release via list query: $tag"
              prerelease="false"
              draft="false"
            fi
          else
            echo "Found via /releases/latest: $tag (prerelease=$prerelease, draft=$draft)"
          fi

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "No stable Release found; skipping stable build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stable releases must match vX.Y.Z (e.g., v0.8.6).
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Latest tag $tag does not match vX.Y.Z; skipping stable build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected latest stable upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether stable release is already published
        id: publication
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SKIP_RELEASE: ${{ steps.release.outputs.skip }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_RELEASE" == "true" ]]; then
            echo "No valid Release; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use the version tag as the deduplication key (e.g., v0.8.6).
          target_image="${IMAGE_NAME}:${RELEASE_TAG}"
          if docker manifest inspect "$target_image" > /dev/null 2>&1; then
            echo "Upstream stable release $RELEASE_TAG already published as $target_image; skipping stable build."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream stable release $RELEASE_TAG not yet published; preparing stable build."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Epic Games Lore source (release tag)
        if: steps.publication.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: ${{ steps.release.outputs.tag }}
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        if: steps.publication.outputs.should_publish == 'true'
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream stable release ${{ steps.release.outputs.tag }} commit: $full_sha"

      - name: Set up QEMU
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata (stable)
        id: meta
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Stable releases are published with:
          #   stable          -> always points to the latest stable release (convenient for tracking)
          #   v0.8.6          -> full version synced with the upstream tag
          #   0.8.6 / 0.8 / 0 -> semver aliases without the v prefix (for different reference conventions)
          #   sha-xxx         -> immutable commit tag for traceability
          tags: |
            type=raw,value=stable
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push stable image
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server-stable
          cache-to: type=gha,mode=max,scope=lore-server-stable
