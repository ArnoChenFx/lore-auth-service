# ── Lore Server Docker image publishing workflow ──
# Scheduled tasks (daily at 03:17 UTC; GitHub may delay or drop schedule runs):
#   - Build the upstream EpicGames/lore main branch as nightly + latest + sha-xxx (skip if the sha tag already exists in GHCR)
#   - Check upstream for a new stable Release (e.g., v0.8.6, excluding draft/prerelease); if GHCR does not yet have the version tag, build and push stable + v0.8.6 + semver aliases + sha-xxx
# Manual trigger (workflow_dispatch), select which jobs run via `mode`:
#   - mode=manual (default): the original flow, build any lore_ref as image_tag
#   - mode=nightly: run the nightly flow immediately (upstream main -> nightly + latest + sha-xxx)
#   - mode=stable: run the stable flow immediately (detect latest release -> stable + version tags)
#   - mode=all: run both nightly and stable flows (same as one scheduled run)
#   - force_rebuild (nightly/stable/all only): skip the GHCR dedup check and rebuild
#     even if the dedup tag already exists, e.g. to re-point the nightly/stable tag
#     at a commit whose sha tag was pushed by another path

name: Lore Server Docker Publish

on:
  # Check upstream daily at 03:17 UTC.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "manual = build lore_ref below; nightly/stable/all = run the scheduled flows now"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - nightly
          - stable
          - all
      force_rebuild:
        description: "Nightly/stable/all only: skip the GHCR dedup check and force a rebuild"
        required: false
        default: false
        type: boolean
      lore_ref:
        description: "Branch, tag, or commit SHA from EpicGames/lore (mode=manual only)"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Image tag to publish to GHCR, such as latest or v0.1.0 (mode=manual only)"
        required: true
        default: "latest"
        type: string
      platforms:
        description: "Target platform; Lore arm64 builds require SVE-capable AWS Graviton3"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/arm64"
          - "linux/amd64,linux/arm64"

env:
  # GitHub Container Registry requires a lowercase image owner and repository name.
  IMAGE_NAME: ghcr.io/arnochenfx/lore-server

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Manual build: fully compatible with the original logic.
  # Runs only for workflow_dispatch with mode=manual (the default).
  # ═══════════════════════════════════════════════════════════════
  build-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'manual' }}
    name: Manual build
    runs-on: ubuntu-latest
    concurrency:
      # Serialize by input tag to prevent older runs from overwriting newer manifests.
      group: lore-server-docker-${{ inputs.image_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate publishing inputs
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$INPUT_IMAGE_TAG" =~ ^[a-z0-9_][a-z0-9._-]{0,127}$ ]]; then
            echo "The image tag may contain only lowercase letters, digits, dots, underscores, and hyphens."
            exit 1
          fi

      - name: Check out Epic Games Lore source
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: ${{ inputs.lore_ref }}
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Building Lore commit: $full_sha (ref: ${{ inputs.lore_ref }})"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
            type=semver,pattern={{major}},value=${{ inputs.image_tag }},enable=${{ startsWith(inputs.image_tag, 'v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server
          cache-to: type=gha,mode=max,scope=lore-server

  # ═══════════════════════════════════════════════════════════════
  # Nightly: tracks the latest commit on upstream main.
  # Runs on schedule, or manually via workflow_dispatch with
  # mode=nightly / mode=all (force_rebuild bypasses the dedup check).
  # Tags: nightly + latest + sha-<short> (latest tracks nightly)
  # Deduplication: skip if sha-xxx already exists in GHCR
  # ═══════════════════════════════════════════════════════════════
  build-nightly:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'nightly' || inputs.mode == 'all')) }}
    name: Nightly build (main → nightly)
    runs-on: ubuntu-latest
    concurrency:
      group: lore-server-docker-nightly
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out Epic Games Lore source (main)
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: main
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream main HEAD: $full_sha"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dedup check via the GHCR Registry API with explicit HTTP status handling.
      # Do NOT rely on `docker manifest inspect` exit codes: in the scheduled run
      # of 2026-08-30 it returned 0 even though the tag did not exist (GHCR
      # replied 404 MANIFEST_UNKNOWN), so the nightly build was wrongly treated
      # as "already published" and silently skipped. Semantics: 200 = published,
      # 404 = not published, anything else (5xx/401/429, ...) fails the job
      # instead of silently skipping.
      - name: Check whether nightly revision is already published
        id: publication
        shell: bash
        env:
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          # Manual runs may force a rebuild, bypassing the dedup check entirely
          # (e.g. to re-point the nightly tag at a commit whose sha tag already exists).
          if [[ "${FORCE_REBUILD:-false}" == "true" ]]; then
            echo "Force rebuild requested; skipping the GHCR dedup check."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          repo="${IMAGE_NAME#ghcr.io/}"           # e.g. arnochenfx/lore-server
          target_tag="sha-${SOURCE_SHORT_SHA}"

          # Exchange the repository GITHUB_TOKEN for a GHCR pull token
          # (packages: write includes read). Still works if the package is
          # made private later; a token request failure exits non-zero.
          token=$(curl -sSf --retry 3 --retry-delay 2 \
            -u "${GITHUB_REPOSITORY_OWNER}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
            | jq -r '.token')

          # Query the manifest and judge only by the HTTP status code,
          # never by any CLI exit code.
          code=$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${target_tag}")

          immutable_image="${IMAGE_NAME}:${target_tag}"
          if [[ "$code" == "200" ]]; then
            echo "Upstream commit already published as $immutable_image; skipping nightly build."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "404" ]]; then
            echo "Upstream commit not yet published as $immutable_image; starting nightly build."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP status $code while checking $immutable_image; failing instead of guessing." >&2
            exit 1
          fi

      - name: Set up QEMU
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata (nightly)
        id: meta
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Daily builds are always tagged as nightly and latest, plus an immutable sha tag for traceability.
          tags: |
            type=raw,value=nightly
            type=raw,value=latest
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push nightly image
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server-nightly
          cache-to: type=gha,mode=max,scope=lore-server-nightly

  # ═══════════════════════════════════════════════════════════════
  # Auto stable: detects the latest upstream stable Release.
  # Runs on schedule, or manually via workflow_dispatch with
  # mode=stable / mode=all (force_rebuild bypasses the dedup check).
  # Tags: stable + v0.8.6 + semver aliases (0.8.6/0.8/0) + sha-xxx
  # Deduplication: skip if GHCR already has the v0.8.6 tag
  # Logic: call /releases/latest (excludes draft/prerelease),
  #        fallback to scanning /releases list for the latest non-prerelease if needed
  # ═══════════════════════════════════════════════════════════════
  build-stable:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'stable' || inputs.mode == 'all')) }}
    name: Stable build (release → stable + version)
    runs-on: ubuntu-latest
    concurrency:
      group: lore-server-docker-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve latest stable release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Querying upstream for the latest stable Release..."
          api_latest="https://api.github.com/repos/EpicGames/lore/releases/latest"
          api_list="https://api.github.com/repos/EpicGames/lore/releases?per_page=20"

          # Prefer /releases/latest (GitHub automatically excludes draft/prerelease).
          response=$(curl -sk -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api_latest" || true)
          tag=$(echo "$response" | jq -r '.tag_name // empty' 2>/dev/null || true)
          prerelease=$(echo "$response" | jq -r '.prerelease // empty' 2>/dev/null || true)
          draft=$(echo "$response" | jq -r '.draft // empty' 2>/dev/null || true)
          message=$(echo "$response" | jq -r '.message // empty' 2>/dev/null || true)

          # Fallback to list query if /latest returns no valid tag (e.g., API rate limit or no stable release).
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "/releases/latest returned no valid tag (message: $message); scanning /releases list..."
            list_response=$(curl -sk -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api_list" || true)
            tag=$(echo "$list_response" | jq -r '[.[] | select(.draft==false and .prerelease==false)] | sort_by(.published_at) | last | .tag_name // empty' 2>/dev/null || true)
            if [[ -n "$tag" && "$tag" != "null" ]]; then
              echo "Found latest stable release via list query: $tag"
              prerelease="false"
              draft="false"
            fi
          else
            echo "Found via /releases/latest: $tag (prerelease=$prerelease, draft=$draft)"
          fi

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "No stable Release found; skipping stable build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stable releases must match vX.Y.Z (e.g., v0.8.6).
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Latest tag $tag does not match vX.Y.Z; skipping stable build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected latest stable upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same dedup strategy as the nightly job: GHCR Registry API with explicit
      # HTTP status handling; do not rely on docker manifest inspect exit codes
      # (see the comment in the nightly job).
      - name: Check whether stable release is already published
        id: publication
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SKIP_RELEASE: ${{ steps.release.outputs.skip }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          # Manual runs may force a rebuild, bypassing the dedup check entirely
          # (e.g. to rebuild a release whose image was pushed broken or deleted).
          if [[ "${FORCE_REBUILD:-false}" == "true" ]]; then
            echo "Force rebuild requested; skipping the GHCR dedup check."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$SKIP_RELEASE" == "true" ]]; then
            echo "No valid Release; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use the version tag as the deduplication key (e.g., v0.8.6).
          repo="${IMAGE_NAME#ghcr.io/}"

          token=$(curl -sSf --retry 3 --retry-delay 2 \
            -u "${GITHUB_REPOSITORY_OWNER}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
            | jq -r '.token')

          code=$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${RELEASE_TAG}")

          target_image="${IMAGE_NAME}:${RELEASE_TAG}"
          if [[ "$code" == "200" ]]; then
            echo "Upstream stable release $RELEASE_TAG already published as $target_image; skipping stable build."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "404" ]]; then
            echo "Upstream stable release $RELEASE_TAG not yet published; preparing stable build."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP status $code while checking $target_image; failing instead of guessing." >&2
            exit 1
          fi

      - name: Check out Epic Games Lore source (release tag)
        if: steps.publication.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: EpicGames/lore
          ref: ${{ steps.release.outputs.tag }}
          path: lore-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lore source revision
        id: source
        if: steps.publication.outputs.should_publish == 'true'
        shell: bash
        working-directory: lore-source
        run: |
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream stable release ${{ steps.release.outputs.tag }} commit: $full_sha"

      - name: Set up QEMU
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata (stable)
        id: meta
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Stable releases are published with:
          #   stable          -> always points to the latest stable release (convenient for tracking)
          #   v0.8.6          -> full version synced with the upstream tag
          #   0.8.6 / 0.8 / 0 -> semver aliases without the v prefix (for different reference conventions)
          #   sha-xxx         -> immutable commit tag for traceability
          tags: |
            type=raw,value=stable
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/EpicGames/lore
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}

      - name: Build and push stable image
        if: steps.publication.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./lore-source
          file: ./lore-source/lore-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lore-server-stable
          cache-to: type=gha,mode=max,scope=lore-server-stable
