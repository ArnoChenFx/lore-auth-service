# Build and publish versioned Lore Auth Service standalone executables.
name: Executable Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Run type checking
        run: bun run typecheck

      - name: Run tests
        run: bun test

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            executable: lore-auth
          - target: linux-arm64
            executable: lore-auth
          - target: linux-x64-musl
            executable: lore-auth
          - target: linux-arm64-musl
            executable: lore-auth
          - target: windows-x64
            executable: lore-auth.exe
          - target: macos-x64
            executable: lore-auth
          - target: macos-arm64
            executable: lore-auth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Compile target
        run: bun run build:compile --target=${{ matrix.target }}

      - name: Verify Linux glibc executable
        if: matrix.target == 'linux-x64'
        run: bun run test:compiled dist/${{ matrix.target }}/lore-auth

      - name: Verify Linux musl executable
        if: matrix.target == 'linux-x64-musl'
        shell: bash
        run: |
          executable="$GITHUB_WORKSPACE/dist/${{ matrix.target }}/lore-auth"
          test -x "$executable"
          expected_version="$(bun -p "require('./package.json').version")"
          docker run --rm \
            --env EXPECTED_VERSION="$expected_version" \
            --volume "$GITHUB_WORKSPACE/dist/${{ matrix.target }}:/app:ro" \
            --workdir /app \
            alpine:3.22 \
            sh -euc '
              apk add --no-cache libstdc++ libgcc
              version="$(./lore-auth --version)"
              test "$version" = "$EXPECTED_VERSION"
              ./lore-auth --check-embedded-protos
            '

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: lore-auth-${{ matrix.target }}
          path: dist/${{ matrix.target }}/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled executables
        uses: actions/download-artifact@v4
        with:
          pattern: lore-auth-*
          path: release-staging

      - name: Package release executables
        shell: bash
        run: |
          mkdir -p release-assets
          targets=(
            linux-x64
            linux-arm64
            linux-x64-musl
            linux-arm64-musl
            windows-x64
            macos-x64
            macos-arm64
          )

          for target in "${targets[@]}"; do
            executable="lore-auth"
            if [[ "$target" == "windows-x64" ]]; then
              executable="lore-auth.exe"
            fi

            source_dir="$GITHUB_WORKSPACE/release-staging/lore-auth-$target"
            archive="$GITHUB_WORKSPACE/release-assets/lore-auth-$target.zip"
            test -f "$source_dir/$executable"
            if [[ "$target" != "windows-x64" ]]; then
              chmod +x "$source_dir/$executable"
            fi

            (
              cd "$source_dir"
              zip -9 "$archive" "$executable"
            )

            # Every release archive must contain exactly one executable at its root.
            test "$(zipinfo -1 "$archive")" = "$executable"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
