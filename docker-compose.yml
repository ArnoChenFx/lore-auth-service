# ── Lore Auth Service Docker Compose ──
# Usage:
#   docker-compose up -d          Start the service.
#   docker-compose logs -f        View logs.
#   docker-compose down           Stop and remove containers.

services:
  lore-auth:
    # Build method: build directly using the Dockerfile in the current directory.
    # To use a pre-built image automatically published by CI on GitHub Container Registry,
    # comment out the build block below and uncomment one of the image lines (choose one):
    # image: ghcr.io/arnochenfx/lore-auth-service:latest
    # image: ghcr.io/arnochenfx/lore-auth-service:v1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lore-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      # This checked-in configuration is for local API development. A real Lore Client login
      # requires a trusted TLS certificate and an HTTPS gRPC auth URL; see README.md.
      JWT_ISSUER: "http://localhost:8080"
      JWT_AUDIENCE: "localhost"
      PUBLIC_BASE_URL: "http://localhost:8080"
      GRPC_PORT: "50051"
      LORE_ENVIRONMENT: "local"
      # Access tokens remain valid for 10 days by default.
      TOKEN_TTL: "864000"
      REFRESH_TOKEN_TTL: "604800"
      AUTH_SESSION_TTL: "300"
      # Password login throttling; a value of 0 disables that scope. See README "Login throttling".
      LOGIN_MAX_FAILURES_PER_USER_IP: "${LOGIN_MAX_FAILURES_PER_USER_IP:-5}"
      LOGIN_MAX_FAILURES_PER_IP: "${LOGIN_MAX_FAILURES_PER_IP:-100}"
      LOGIN_MAX_FAILING_IPS_PER_ACCOUNT: "${LOGIN_MAX_FAILING_IPS_PER_ACCOUNT:-50}"
      LOGIN_LOCK_BASE_SECONDS: "${LOGIN_LOCK_BASE_SECONDS:-60}"
      LOGIN_LOCK_MAX_SECONDS: "${LOGIN_LOCK_MAX_SECONDS:-900}"
      # Keep 0 unless a reverse proxy in front of this service forwards client addresses.
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-0}"
      HEALTHCHECK_URL: "http://localhost:8080/health_check"

      # Administrator account created on first startup. The password is required; set it in the
      # shell or in a .env file next to this compose file.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the shell or a .env file}"
    volumes:
      # RSA key pair persistence. Deleting it regenerates the keys and invalidates all issued tokens.
      - lore-auth-keys:/app/keys
      # SQLite database persistence.
      - lore-auth-data:/app/data
      # For production, mount a certificate directory and set:
      # TLS_CERT_FILE=/app/certs/fullchain.pem
      # TLS_KEY_FILE=/app/certs/privkey.pem
      # - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch(process.env.HEALTHCHECK_URL).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  lore-auth-keys:
  lore-auth-data:
